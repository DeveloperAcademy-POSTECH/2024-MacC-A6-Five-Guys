name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SPM_CACHE_PATH: .build/SourcePackages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Config.xcconfig는 Debug/Release의 base configuration이며 gitignore 대상이라
      # 복사하지 않으면 빌드 자체가 실패한다. 값은 placeholder로 충분하다
      # (CI는 알라딘 API를 호출하지 않는다).
      #
      # GoogleService-Info.plist는 일부러 만들지 않는다. plist 없이도 Debug 앱이 실행되고
      # 테스트는 Firebase를 초기화하지 않으므로 CI에 가짜 자격증명을 심을 이유가 없다.
      - name: Bootstrap local build config
        run: cp FiveGuyes/Config.xcconfig.example FiveGuyes/Config.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE_PATH }}
          key: spm-${{ runner.os }}-${{ hashFiles('FiveGuyes/FiveGuyes.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache SwiftLint
        uses: actions/cache@v4
        with:
          path: .build/tools
          key: swiftlint-${{ runner.os }}-${{ hashFiles('scripts/swiftlint.sh') }}

      # 시뮬레이터 선택, lint, 단일 시뮬레이터 테스트는 로컬과 같은 스크립트가 맡는다.
      - name: Verify
        run: CI=true RESULT_BUNDLE_PATH=TestResults.xcresult scripts/verify.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
